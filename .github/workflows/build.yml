name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      FLET_CLI_NO_INTERACTIVE: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: pip install flet

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Build APK
        run: flet build apk --project "Cứ Bình Thường" --org "com.cubinhtthuong" --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubinhtthuong-apk
          path: build/apk/*.apk
